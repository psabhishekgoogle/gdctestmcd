apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-volumesnapshot-sa
  namespace: mcdonaldstest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volumesnapshot-role
  namespace: mcdonaldstest
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volumesnapshotclass-cluster-role
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob_volumesnapshot_rb
  namespace: mcdonaldstest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volumesnapshot-role
subjects:
- kind: ServiceAccount
  name: cronjob-volumesnapshot-sa
  namespace: mcdonaldstest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volumesnapshotclass-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volumesnapshotclass-cluster-role
subjects:
- kind: ServiceAccount
  name: cronjob-volumesnapshot-sa
  namespace: mcdonaldstest
---
apiVersion: v1
data:
  LIST_OF_PVC_NAMES: '["ubuntu-iso-disk","ubuntu-main-disk"]'
  RETENTION_TOTAL: "1"
  SCHEDULE: '0 0 * * *'
kind: ConfigMap
metadata:
  labels:
    app-config: snapshot-config
    generated-by-kustomize: "true"
  name: snapshot-config-55m95k59fm
  namespace: mcdonaldstest
---
apiVersion: v1
data:
  snapshot_script.py: "import os\nimport json  \nfrom kubernetes import client, config\nfrom
    kubernetes.client.rest import ApiException\nfrom datetime import datetime, timezone\n\ndef
    main():\n    try:\n        config.load_incluster_config()  \n    except config.ConfigException:\n
    \       config.load_kube_config()  \n\n    retention_total = int(os.environ.get(\"RETENTION_TOTAL\",
    \"3\"))\n    pvc_names_str = os.environ.get(\"LIST_OF_PVC_NAMES\", \"[]\")  \n\n
    \   try:\n        pvc_names = json.loads(pvc_names_str)\n    except json.JSONDecodeError:\n
    \       print(\"Error: LIST_OF_PVC_NAMES is not a valid JSON array.\")\n        return\n\n
    \   if not isinstance(pvc_names, list):\n        print(\"Error: LIST_OF_PVC_NAMES
    must be a list/array.\")\n        return\n\n    if not pvc_names:\n        print(\"No
    PVC names provided in LIST_OF_PVC_NAMES.\")\n        return\n\n    api = client.CustomObjectsApi()\n
    \   core_v1 = client.CoreV1Api()\n    namespace = get_namespace()\n\n    snapshot_class_name
    = \"robin-snapshotclass\"\n    try:\n        api.get_cluster_custom_object(\n
    \           group=\"snapshot.storage.k8s.io\",\n            version=\"v1\",\n
    \           plural=\"volumesnapshotclasses\",\n            name=snapshot_class_name,\n
    \       )\n    except ApiException as e:\n        if e.status == 404:\n            raise
    Exception(f\"VolumeSnapshotClass '{snapshot_class_name}' not found.\")\n        else:\n
    \           raise Exception(f\"Error checking VolumeSnapshotClass '{snapshot_class_name}':
    {e}\")\n\n    for pvc_name in pvc_names:\n        try:\n            core_v1.read_namespaced_persistent_volume_claim(name=pvc_name,
    namespace=namespace)\n        except ApiException as e:\n            if e.status
    == 404:\n                print(f\"PVC '{pvc_name}' not found in namespace '{namespace}'.
    Skipping.\")\n                continue  \n            else:\n                print(f\"Error
    checking PVC '{pvc_name}': {e}\")\n                continue \n\n        create_snapshot(api,
    pvc_name, namespace, snapshot_class_name)\n        manage_retention(api, pvc_name,
    namespace, retention_total)\n\ndef get_namespace():\n    try:\n        with open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\",
    \"r\") as f:\n            return f.read().strip()\n    except FileNotFoundError:\n
    \       return \"default\"\n\ndef create_snapshot(api, pvc_name, namespace, snapshot_class_name):\n
    \   snapshot_name = f\"{pvc_name}-snapshot-{datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')}\"\n
    \   snapshot_manifest = {\n        \"apiVersion\": \"snapshot.storage.k8s.io/v1\",\n
    \       \"kind\": \"VolumeSnapshot\",\n        \"metadata\": {\n            \"name\":
    snapshot_name,\n            \"namespace\": namespace,\n        },\n        \"spec\":
    {\n            \"volumeSnapshotClassName\": snapshot_class_name,\n            \"source\":
    {\n                \"persistentVolumeClaimName\": pvc_name\n            }\n        }\n
    \   }\n    try:\n        api.create_namespaced_custom_object(\n            group=\"snapshot.storage.k8s.io\",
    version=\"v1\", namespace=namespace,\n            plural=\"volumesnapshots\",
    body=snapshot_manifest,\n        )\n        print(f\"Created snapshot '{snapshot_name}'\")\n
    \   except ApiException as e:\n        print(f\"Error creating snapshot: {e}\")\n\n\ndef
    manage_retention(api, pvc_name, namespace, retention_total):\n    try:\n        snapshots
    = api.list_namespaced_custom_object(\n            group=\"snapshot.storage.k8s.io\",\n
    \           version=\"v1\",\n            namespace=namespace,\n            plural=\"volumesnapshots\",\n
    \       )\n    except ApiException as e:\n        print(f\"Error listing snapshots:
    {e}\")\n        return\n\n    pvc_snapshots = []\n    for item in snapshots[\"items\"]:\n
    \       if (item[\"spec\"].get(\"source\", {}).get(\"persistentVolumeClaimName\")
    == pvc_name) and (item[\"status\"][\"readyToUse\"] == True):\n            print(f\"Identified
    a snapshot that is ready '{item['metadata']['name']}'. Adding to count.\")\n            pvc_snapshots.append(item)\n
    \       else:\n            print(f\"Identified a snapshot that is not ready '{item['metadata']['name']}'.
    Skipping.\")\n\n    pvc_snapshots.sort(key=lambda x: x[\"metadata\"][\"creationTimestamp\"])\n\n
    \   while len(pvc_snapshots) > retention_total:\n        oldest_snapshot = pvc_snapshots.pop(0)\n
    \       try:\n            api.delete_namespaced_custom_object(\n                group=\"snapshot.storage.k8s.io\",
    version=\"v1\", namespace=namespace,\n                plural=\"volumesnapshots\",
    name=oldest_snapshot[\"metadata\"][\"name\"],\n            )\n            print(f\"Deleted
    old snapshot '{oldest_snapshot['metadata']['name']}'\")\n        except ApiException
    as e:\n            print(f\"Error deleting snapshot: {e}\")\n\nif __name__ ==
    \"__main__\":\n    main()"
kind: ConfigMap
metadata:
  name: snapshot-script-cm
  namespace: mcdonaldstest
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-snapshot-cronjob
  namespace: mcdonaldstest
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - args:
            - |
              pip install --upgrade pip && pip install kubernetes
              python /app/snapshot_script.py
            command:
            - /bin/sh
            - -c
            env:
            - name: RETENTION_TOTAL
              valueFrom:
                configMapKeyRef:
                  key: RETENTION_TOTAL
                  name: snapshot-config-55m95k59fm
            - name: LIST_OF_PVC_NAMES
              valueFrom:
                configMapKeyRef:
                  key: LIST_OF_PVC_NAMES
                  name: snapshot-config-55m95k59fm
            image: python:3.11.9-slim
            name: snapshot-container
            volumeMounts:
            - mountPath: /app
              name: app-volume
          restartPolicy: OnFailure
          serviceAccountName: cronjob-volumesnapshot-sa
          volumes:
          - configMap:
              name: snapshot-script-cm
            name: app-volume
  schedule: '0 0 * * *'
